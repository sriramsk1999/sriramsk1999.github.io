name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gemfile.lock pins nokogiri 1.12.5-x86_64-linux, which requires Ruby < 3.1
      # (it errors on 3.2 with "incompatible" during bundle install) - this has
      # to match what the *lockfile* supports, not the Dockerfile's Ruby version
      # (the Dockerfile only copies Gemfile, not Gemfile.lock, so it resolves a
      # fresh set of gem versions instead of using these pinned ones).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7"
          bundler-cache: true

      - name: Fetch external link metadata (skips URLs already cached)
        run: bundle exec ruby _scripts/fetch_link_metadata.rb

      - name: Archive pages for the local-preview allowlist (skips URLs already archived)
        run: bundle exec ruby _scripts/archive_pages.rb # ubuntu-latest ships Chrome preinstalled

      - name: Commit refreshed link metadata/archives, if any
        run: |
          if ! git diff --quiet -- _data/link-metadata.json _data/local-archives.json assets/archive; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/link-metadata.json _data/local-archives.json assets/archive
            git commit -m "Update external link metadata/archive cache [skip ci]"
            git push
          fi

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
